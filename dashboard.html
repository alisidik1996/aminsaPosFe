<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Waltie's Rooftop Cafe — Pilih Meja</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body class="app-page">
  <nav class="navbar">
    <div class="nav-brand">Waltie's Rooftop Cafe</div>
    <div class="nav-center">
      <div class="nav-station-links">
        <a href="kitchen.html" class="nav-station-btn kitchen" target="_blank" title="Buka Kitchen Dashboard">
          🍳 Kitchen
        </a>
        <a href="bar.html" class="nav-station-btn bar" target="_blank" title="Buka Bar Dashboard">
          🍹 Bar
        </a>
        <a href="services.html" class="nav-station-btn service" target="_blank" title="Buka Service Dashboard">
          👨‍🍳 Service
        </a>
      </div>
    </div>
    <div class="nav-right">
      <span class="badge-kasir" id="kasirName"></span>
      <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
    </div>
  </nav>
  <div class="container">
    <div class="page-header">
      <h2>Pilih Meja</h2>
      <div style="display:flex;align-items:center;gap:1rem">
        <span id="currentDate" style="font-size:.85rem;color:var(--text-muted)"></span>
        <div class="legend">
          <span class="dot dot-available"></span> Tersedia
          <span class="dot dot-occupied"></span> Terisi
        </div>
      </div>
    </div>
    <div class="table-grid" id="tableGrid"></div>
  </div>
  <div class="modal-overlay hidden" id="tableModal">
    <div class="modal">
      <h3 id="modalTitle">Meja 1</h3>
      <p id="modalDesc"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modalCancel">Batal</button>
        <button class="btn btn-danger btn-sm hidden" id="modalVoid">Tutup Meja</button>
        <button class="btn btn-warning btn-sm hidden" id="modalSwitch">Pindah Meja</button>
        <button class="btn btn-primary" id="modalConfirm">Buka Meja</button>
      </div>
    </div>
  </div>

  <!-- Modal: Pilih Meja Tujuan -->
  <div class="modal-overlay hidden" id="switchModal">
    <div class="modal">
      <h3>Pindah ke Meja</h3>
      <p id="switchModalDesc">Pilih meja tujuan yang tersedia:</p>
      <div class="switch-table-grid" id="switchTableGrid"></div>
      <div class="modal-actions" style="margin-top:1.25rem">
        <button class="btn btn-secondary" id="switchCancel">Batal</button>
      </div>
    </div>
  </div>
  <script src="js/core/api.js"></script>
  <script src="js/core/modal.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
