<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CafePos — Backoffice</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/backoffice.css" />
</head>
<body class="bo-body">
  <aside class="bo-sidebar">
    <div class="bo-logo">Waltie's Rooftop Cafe</div>
    <nav class="bo-nav">
      <button class="bo-nav-item active" data-tab="menu">🍽 Menu</button>
      <button class="bo-nav-item" data-tab="stock">📦 Stok</button>
      <button class="bo-nav-item" data-tab="users">👥 Users</button>
      <button class="bo-nav-item" data-tab="settings">⚙️ Pengaturan</button>
    </nav>
    <div class="bo-sidebar-footer">
      <span id="boKasirName"></span>
      <button class="btn btn-outline btn-sm" id="boLogoutBtn">Logout</button>
    </div>
  </aside>
  <main class="bo-main">
    <header class="bo-header">
      <h1 id="boPageTitle">Menu</h1>
      <button class="btn btn-primary" id="boAddBtn">+ Tambah</button>
    </header>
    <section class="bo-tab active" id="tab-menu">
      <div class="bo-toolbar">
        <input type="text" id="menuSearch" placeholder="🔍 Cari menu..." class="bo-search" />
        <select id="menuCatFilter" class="bo-select"><option value="">Semua Kategori</option></select>
      </div>
      <div class="bo-table-wrap">
        <table class="bo-table">
          <thead><tr><th>Foto</th><th>Nama</th><th>Kategori</th><th>Stasiun</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="menuTbody"></tbody>
        </table>
      </div>
    </section>
    <section class="bo-tab" id="tab-stock">
      <div class="bo-toolbar">
        <input type="text" id="stockSearch" placeholder="🔍 Cari menu..." class="bo-search" />
      </div>
      <div class="bo-table-wrap">
        <table class="bo-table">
          <thead><tr><th>Nama</th><th>Kategori</th><th>Stok Saat Ini</th><th>Update Stok</th></tr></thead>
          <tbody id="stockTbody"></tbody>
        </table>
      </div>
    </section>
    <section class="bo-tab" id="tab-users">
      <div class="bo-table-wrap">
        <table class="bo-table">
          <thead><tr><th>ID</th><th>Username</th><th>Nama</th><th>Role</th><th>Aksi</th></tr></thead>
          <tbody id="usersTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Tab Pengaturan -->
    <section class="bo-tab" id="tab-settings">
      <div class="bo-settings-wrap">
        <div class="bo-settings-card">
          <h3 class="bo-settings-title">🏪 Info Merchant</h3>
          <p class="bo-settings-desc">Informasi ini akan tampil di struk pembayaran.</p>
          <form id="settingsForm">
            <div class="bo-form-grid">
              <div class="form-group bo-full">
                <label>Nama Merchant</label>
                <input type="text" id="sMerchantName" placeholder="Contoh: Waltie's Rooftop Cafe" />
              </div>
              <div class="form-group bo-full">
                <label>Alamat</label>
                <textarea id="sMerchantAddress" rows="3" placeholder="Contoh: Jl. Sudirman No. 10, Jakarta"></textarea>
              </div>
              <div class="form-group">
                <label>No. HP / WhatsApp</label>
                <input type="text" id="sMerchantPhone" placeholder="Contoh: 08123456789" />
              </div>
              <div class="form-group">
                <label>Media Sosial</label>
                <input type="text" id="sMerchantSocial" placeholder="Contoh: @waltiesrooftop" />
              </div>
              <div class="form-group bo-full">
                <label>Pesan Footer Struk</label>
                <input type="text" id="sReceiptFooter" placeholder="Contoh: Terima kasih telah berkunjung!" />
              </div>
            </div>
            <div class="modal-actions" style="justify-content:flex-end;margin-top:1.5rem">
              <button type="submit" class="btn btn-primary" id="settingsSaveBtn">💾 Simpan Pengaturan</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Menu -->
  <div class="modal-overlay hidden" id="menuModal">
    <div class="modal bo-modal">
      <h3 id="menuModalTitle">Tambah Menu</h3>
      <form id="menuForm">
        <div class="bo-form-grid">
          <div class="form-group"><label>Nama Menu</label><input type="text" id="mName" required placeholder="Nama menu" /></div>
          <div class="form-group"><label>Harga (Rp)</label><input type="number" id="mPrice" required min="0" /></div>
          <div class="form-group"><label>Kategori</label><input type="text" id="mCategory" required placeholder="Makanan / Minuman / Snack" /></div>
          <div class="form-group"><label>Stasiun</label><select id="mStation"><option value="kitchen">🍳 Kitchen</option><option value="bar">🍹 Bar</option></select></div>
          <div class="form-group"><label>Stok <span id="mStockHint" style="font-size:.75rem;color:var(--text-muted);font-weight:400"></span></label><input type="number" id="mStock" min="0" value="0" /></div>
          <div class="form-group"><label>Status</label><select id="mActive"><option value="1">Aktif</option><option value="0">Nonaktif</option></select></div>
          <div class="form-group bo-full"><label>URL Foto</label><input type="text" id="mImage" placeholder="https://..." /></div>
          <div class="form-group bo-full" id="mPreviewWrap" style="display:none">
            <img id="mPreview" src="" alt="preview" style="width:100px;height:100px;object-fit:cover;border-radius:8px" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="menuModalCancel">Batal</button>
          <button type="submit" class="btn btn-primary" id="menuModalSave">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal User -->
  <div class="modal-overlay hidden" id="userModal">
    <div class="modal bo-modal">
      <h3 id="userModalTitle">Tambah User</h3>
      <form id="userForm">
        <div class="bo-form-grid">
          <div class="form-group"><label>Username</label><input type="text" id="uUsername" required /></div>
          <div class="form-group"><label>Password</label><input type="password" id="uPassword" /></div>
          <div class="form-group"><label>Nama Lengkap</label><input type="text" id="uName" required /></div>
          <div class="form-group"><label>Role</label><select id="uRole"><option value="kasir">Kasir</option><option value="admin">Admin</option></select></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="userModalCancel">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/core/api.js"></script>
  <script src="js/core/modal.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/pages/backoffice.js"></script>
</body>
</html>
