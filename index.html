<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Waltie's Rooftop Cafe — Login</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo">
      <!-- <span class="logo-icon">☕</span> -->
      <h1>Waltie's Rooftop Cafe</h1>
      <p>Point of Sales</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required />
      </div>
      <div id="loginError" class="error-msg hidden"></div>
      <button type="button" id="loginBtn" class="btn btn-primary btn-full">Login</button>
    </form>
    <p class="hint">Hubungi admin untuk mendapatkan akses.</p>
  </div>
  <script src="js/core/api.js"></script>
  <script src="js/core/modal.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
