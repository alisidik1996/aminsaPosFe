<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon"></span>
      <h1>Point Of Sales</h1>
      <p>Punya Aminsa tapi belum ada namanya</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" autocomplete="off" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required />
      </div>
      <div id="loginError" class="error-msg hidden">Username atau password salah.</div>
      <button type="button" id="loginBtn" class="btn btn-primary btn-full">Login</button>
    </form>
    <p class="hint">Demo: kasir1 / 1234 &nbsp;|&nbsp; kasir2 / 1234</p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
